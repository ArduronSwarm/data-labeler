name: PR Template

on:
  pull_request:
    types: [opened]
    branches: [main, development]

jobs:
  add-template:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Add template and Jira link to PR
        uses: actions/github-script@v7
        env:
          JIRA_AUTH: ${{ secrets.JIRA_AUTH }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const currentBody = context.payload.pull_request.body || '';
            const prNumber = context.issue.number;
            const author = context.payload.pull_request.user.login;

            console.log(`Branch: ${branchName}`);

            // Warn if PR targets main from a non-development branch
            const baseBranch = context.payload.pull_request.base.ref;
            if (baseBranch === 'main' && branchName !== 'development') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: '> **Warning**\n> This PR targets `main` but only the `development` branch should merge into `main`.\n> Please change the base branch to `development`.'
              });
            }

            if (currentBody.includes('## Issue')) {
              console.log('Template already present, skipping');
              return;
            }

            // Clean branch name into PR title (e.g. AR-65-Setup-dev-env-4 → AR-65 Setup dev env-4)
            const keyMatch = branchName.match(/^((?:SP|AR)-\d+)-(.*)/);
            let prTitle = branchName.replace(/-/g, ' ');
            if (keyMatch) {
              const rest = keyMatch[2];
              const suffix = rest.match(/-(\d+)$/);
              const body = (suffix ? rest.slice(0, -suffix[0].length) : rest).replace(/-/g, ' ');
              prTitle = suffix ? `${keyMatch[1]} ${body}-${suffix[1]}` : `${keyMatch[1]} ${body}`;
            }

            const match = branchName.match(/((?:SP|AR)-\d+)/);
            let jiraSection = '';
            if (match) {
              const jiraKey = match[1];
              const jiraUrl = `https://arduron.atlassian.net/browse/${jiraKey}`;

              let ticketTitle = '';
              const jiraAuth = process.env.JIRA_AUTH;
              if (jiraAuth) {
                try {
                  // Fetch ticket title
                  const res = await fetch(
                    `https://arduron.atlassian.net/rest/api/3/issue/${jiraKey}?fields=summary`,
                    { headers: { Authorization: `Basic ${jiraAuth}`, Accept: 'application/json' } }
                  );
                  if (res.ok) {
                    const data = await res.json();
                    ticketTitle = data.fields.summary;
                  }

                  // Auto-assign Jira issue to current user by email
                  const ghUser = await github.rest.users.getByUsername({ username: author });
                  const email = ghUser.data.email;
                  if (email) {
                    const users = await fetch(
                      `https://arduron.atlassian.net/rest/api/3/user/search?query=${email}`,
                      { headers: { Authorization: `Basic ${jiraAuth}`, Accept: 'application/json' } }
                    );
                    if (users.ok) {
                      const found = await users.json();
                      if (found.length > 0) {
                        await fetch(
                          `https://arduron.atlassian.net/rest/api/3/issue/${jiraKey}/assignee`,
                          {
                            method: 'PUT',
                            headers: { Authorization: `Basic ${jiraAuth}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ accountId: found[0].accountId })
                          }
                        );
                        console.log(`Assigned Jira ${jiraKey} to ${email}`);
                      }
                    }
                  }
                } catch (e) {
                  console.log(`Jira API error: ${e.message}`);
                }
              }

              jiraSection = ticketTitle
                ? `[${jiraKey} - ${ticketTitle}](${jiraUrl})`
                : `[${jiraKey}](${jiraUrl})`;
            }

            const newBody = [
              jiraSection,
              '',
              '## What was done',
              currentBody,
              '',
              '## What to expect',
              '',
              '- [ ] ',
              '- [ ] ',
              '- [ ] ',
              '',
              '## Tickets',
              '- [ ] DEV:',
              '- [ ] Frontend:',
              '- [ ] QA (if applicable):'
            ].join('\n');

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              title: prTitle,
              body: newBody
            });

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              assignees: [author]
            });

            console.log('Template and Jira link added');
