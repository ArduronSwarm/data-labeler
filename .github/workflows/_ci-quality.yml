name: Local CI quality contracts
'on':
  workflow_call:
    inputs:
      coverage:
        description: Explicit repository validation scope
        required: true
        type: string
permissions:
  contents: read
jobs:
  contracts:
    name: Workflow and automation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Validate GitHub Actions semantics with pinned actionlint
      run: |
        set -euo pipefail
        actionlint_archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
        actionlint_directory="$RUNNER_TEMP/actionlint-1.7.12"
        curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
          --output "$actionlint_archive"
        printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$actionlint_archive" | sha256sum --check --strict
        mkdir -p "$actionlint_directory"
        tar -xzf "$actionlint_archive" -C "$actionlint_directory" actionlint
        "$actionlint_directory/actionlint" -no-color -shellcheck= -pyflakes=
    - name: Install the locked workflow parser
      run: 'python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/scripts/ar2920-ci/requirements.txt'
    - name: Test required-check contract regressions
      run: python -m unittest discover -s .github/scripts/ar2920-ci -p 'test_*.py' -v
    - name: Validate workflows and automation helpers
      env:
        CI_COVERAGE: ${{ inputs.coverage }}
      run: python .github/scripts/ar2920-ci/validate.py --root . --expect-coverage "$CI_COVERAGE"
