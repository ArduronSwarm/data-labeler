# Automation contract v1.0.0; canonical source: othryn-stack/tools/ci-cd/automation.
name: PR Health Check

on:
  pull_request_target:
    branches: [main, development]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, assigned, unassigned, review_requested, review_request_removed, edited]
  pull_request_review:
    types: [submitted, dismissed]


permissions:
  contents: read

concurrency:
  group: pr-health-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  health-check:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout trusted automation only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Run pr-health
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_CODE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/automation/runner.mjs pr-health
